name: Render Quarto Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Set up Quarto CLI
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Step 3 — Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Step 4 — Cache R packages
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ~/.R/library
          key: ${{ runner.os }}-r-${{ hashFiles('**/*.R', '**/*.qmd') }}
          restore-keys: |
            ${{ runner.os }}-r-

      # Step 5 — Install R packages
      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown","knitr","lavaan","dplyr", "stringr"), repos="https://cloud.r-project.org")'


      - name: Render project
        run: |
          quarto render

      - name: Publish to GitHub Pages
        run: |
          quarto publish gh-pages --no-prompt
